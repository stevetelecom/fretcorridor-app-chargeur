services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: fretcorridor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fretcorridor-net

  backend:
    build:
      context: ./backend
    container_name: fretcorridor-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Chemin DANS le conteneur (voir volumes ci-dessous) - jamais le
      # chemin local, qui n'existe pas a l'interieur de l'image.
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    volumes:
      # Lecture seule : le backend n'a jamais besoin d'ecrire ce fichier.
      - ./backend/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    networks:
      - fretcorridor-net

volumes:
  db_data:

networks:
  fretcorridor-net:
    driver: bridge
