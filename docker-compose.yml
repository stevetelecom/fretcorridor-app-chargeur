services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: fretcorridor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fretcorridor-net

  backend:
    build:
      context: ./backend
    container_name: fretcorridor-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8099:8099"
    networks:
      - fretcorridor-net

volumes:
  db_data:

networks:
  fretcorridor-net:
    driver: bridge
