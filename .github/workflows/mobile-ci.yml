name: Mobile CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      # Reconstruit le keystore de signature release a partir des secrets -
      # jamais commite dans le repo (voir mobile/.gitignore). Sans ca,
      # `flutter build apk --release` utiliserait la signature debug par
      # defaut, inacceptable meme pour une distribution de test.
      # google-services.json est gitignore (config Firebase sensible) -
      # reconstruit ici a partir du secret, meme logique que le keystore.
      - name: Reconstruire google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Reconstruire le keystore de signature
        run: |
          # Le module Gradle est android/app/ - c'est depuis ce dossier
          # que file() resout un chemin relatif dans build.gradle.kts,
          # donc le .jks doit y vivre pour que storeFile=upload-keystore.jks
          # soit trouve correctement au moment du build.
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties << KEYPROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          KEYPROPS

      # Build release avec l'URL backend Render injectee explicitement -
      # jamais le fallback dev code en dur dans session_provider.dart.
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Distribuer via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:1062538463562:android:d4308241e7b9649e3059b3
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: recruteur
          file: mobile/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Build automatique depuis main (${{ github.sha }})
