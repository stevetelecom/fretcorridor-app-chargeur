spring:
  application:
    name: fretcorridor-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fretcorridor}
    username: ${DB_USER:fretcorridor_user}
    password: ${DB_PASSWORD:change_me}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET:change_me_en_local_uniquement}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  admin:
    # Cle du mini-outil admin (AdminApiKeyInterceptor) - totalement separee
    # du JWT chargeur. A generer avec `openssl rand -hex 32` et a ne JAMAIS
    # committer la vraie valeur (seul ce defaut de dev va dans le repo).
    api-key: ${ADMIN_API_KEY:change_me_admin_key_en_local}
  firebase:
    # En local (hors Docker) : chemin relatif vers backend/firebase-service-account.json
    # (jamais commite, voir .gitignore). En Docker : ecrase par FIREBASE_CREDENTIALS_PATH
    # dans docker-compose.yml, qui pointe vers le fichier monte en volume.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.fretcorridor: INFO
    org.springframework.security: INFO
